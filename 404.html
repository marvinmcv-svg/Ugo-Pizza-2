<!doctype html>
<html lang="es-BO">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página no encontrada · Ugo's Pizza</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ff4200">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --red: #ff4200; --wine: #140a07; --cream: #fbf6e9; --mustard: #ffd400; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--cream); color: var(--wine); font: 17px/1.6 "DM Sans", system-ui, sans-serif; text-align: center; padding: 32px 16px; }
    img { display: block; margin: 0 auto 8px; width: min(420px, 90vw); height: auto; }
    h1 { font: 400 clamp(3rem, 12vw, 6rem)/.9 "Bangers", Impact, sans-serif; margin: 0 0 12px; color: var(--red); letter-spacing: .02em; }
    p { margin: 0 auto 28px; max-width: 40ch; opacity: .85; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.btn { display: inline-flex; padding: .9em 1.6em; border-radius: 999px; font-weight: 700; text-decoration: none; background: var(--mustard); color: var(--wine); }
    a.btn--ghost { background: transparent; color: var(--wine); box-shadow: inset 0 0 0 2px currentColor; }
    a:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/ugo-espiando.webp" width="1100" height="638" alt="Ugo espiando">

    <div class="row">
      <a class="btn" href="/">Volver a Ugo's</a>
      <a class="btn btn--ghost" href="/#menu">Ver la carta</a>
      <a class="btn btn--ghost" href="https://wa.me/59160007071" target="_blank" rel="noopener">WhatsApp 60007071</a>
    </div>
  </main>
</body>
</html>
